<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triton Anchor · Local CI</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f5f7fa;color:#17253a}main{max-width:1100px;margin:auto;padding:32px 20px}h1{margin-bottom:0}a{color:#1760b5}header p{color:#586779}article,section{background:white;border:1px solid #dce3ed;border-radius:12px;padding:20px;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e9edf3}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}small{color:#586779}summary{cursor:pointer;font-weight:600}.pass{color:#16764c}.fail,.infra_error{color:#b32a33}.pending{color:#94621b}.cancelled{color:#637187}code{overflow-wrap:anywhere}#empty{padding:32px;color:#586779}
</style>
<main>
<header><h1>Local CI 任务与运行状态</h1><p id="updated">正在加载最近一次 GitHub 回写快照…</p></header>
<section><h2>服务与通知</h2><div id="health">尚无监控快照</div></section>
<div id="tasks"></div>
</main>
<script>
const el=(tag,text)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;return node};
function detail(title,data){const node=el('details');node.append(el('summary',title),el('pre',JSON.stringify(data??[],null,2)));return node}
async function refresh(){
  try{
    const response=await fetch('data/v4-tasks.json',{cache:'no-store'});if(!response.ok)throw Error('尚无 v4 任务快照');
    const data=await response.json();document.querySelector('#updated').textContent='更新于 '+data.generated_at+' · 仅当前有效任务可回写通过状态';
    const target=document.querySelector('#tasks');target.replaceChildren();
    if(!data.tasks.length)target.append(el('p','暂无已投递任务。'));
    for(const row of data.tasks){
      const task=row.task, result=row.result, article=el('article');
      article.append(el('h2',(task.pr_number?'PR #'+task.pr_number:task.target_branch)+' · '+task.title));
      const status=el('strong',row.status);status.className=row.status;article.append(status);
      article.append(el('p','目标：'+task.target_branch+' · 被测提交：'+task.tested_sha));
      article.append(el('small','task '+task.task_id+(result?' · run '+result.run_id:'')));
      if(result){const table=el('table'),head=el('tr');for(const label of ['检查','结果','必检','原因'])head.append(el('th',label));table.append(head);
        for(const check of result.checks){const tr=el('tr');for(const value of [check.tool_id,check.status,check.required?'是':'否',check.reason||''])tr.append(el('td',value));table.append(tr)}
        article.append(table,detail('阻塞项与后续处理',result.blockers),detail('AI 审查、定向验证和证据',{reviews:result.reviews,findings:result.findings}),detail('性能变化（纯耗时回退不阻断）',result.performance),detail('未完成与环境', {unfinished:result.unfinished,environment:result.environment}));
      }else if(row.retention){article.append(el('p','结果已超过 Gitee 保留期，证据目录已清理；GitHub 已发布的状态保留。'),detail('过期结果身份与摘要',row.retention));
      }else article.append(el('p','任务尚未返回结果。取消、未完成的任务不会显示为通过。'));
      target.append(article);
    }
  }catch(error){document.querySelector('#updated').textContent=error.message;}
  try{const response=await fetch('data/v4-incidents.json',{cache:'no-store'});if(response.ok){const data=await response.json();document.querySelector('#health').replaceChildren(detail('查看服务器、服务、容器和通知状态',data));}}catch(_error){}
}
refresh();setInterval(refresh,60000);
</script>
</html>
