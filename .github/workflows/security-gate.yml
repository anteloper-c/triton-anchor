name: Security Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  high-confidence-secret-scan:
    name: Block credentials and new network access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted security scanner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Scan added lines for credentials and network access
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/scan_pr_security.py --mode block

  critical-runtime-dependency-review:
    name: Block critical runtime dependency vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow context
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Review newly introduced dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
          fail-on-scopes: runtime,unknown
          license-check: false
          comment-summary-in-pr: never

  codeql-analysis:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp]
    steps:
      - name: Check out exact PR commit without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze exact PR commit
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

  security-warnings:
    name: Warn on risky constructs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted security scanner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Report non-blocking findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/scan_pr_security.py --mode warn

  authorize-local-ci:
    name: Authorize exact PR commit for local CI
    needs:
      - high-confidence-secret-scan
      - critical-runtime-dependency-review
      - codeql-analysis
      - security-warnings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write trusted dispatch metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p "${RUNNER_TEMP}/security-gate"
          jq -n \
            --arg pr_number "${PR_NUMBER}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg head_ref "${HEAD_REF}" \
            --arg head_repo "${HEAD_REPO}" \
            --arg base_sha "${BASE_SHA}" \
            --arg base_ref "${BASE_REF}" \
            '{
              pr_number: $pr_number,
              head_sha: $head_sha,
              head_ref: $head_ref,
              head_repo: $head_repo,
              base_sha: $base_sha,
              base_ref: $base_ref
            }' > "${RUNNER_TEMP}/security-gate/metadata.json"

      - name: Publish trusted dispatch metadata
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-metadata
          path: ${{ runner.temp }}/security-gate/metadata.json
          retention-days: 1
          if-no-files-found: error
