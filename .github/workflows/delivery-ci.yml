name: Delivery CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-precheck:
    name: Delivery Scripts Precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Check delivery scripts
        run: |
          bash -n scripts/ci/configure_backend_profile.sh
          bash -n scripts/ci/setup_prebuilt_deps.sh
          bash -n scripts/ci/build_frontend.sh
          bash -n scripts/ci/install_backend.sh
          bash -n scripts/ci/install_backend_deps.sh
          bash -n scripts/ci/run_delivery_smoke.sh
          bash -n scripts/ci/run_flaggems_tests.sh
          python -m py_compile scripts/ci/collect_delivery_evidence.py
          python -m py_compile tests/test_smoke.py

      - name: Run pure Python frontend tests
        run: >-
          python -m pytest
          python/triton_anchor/tests/test_anchor_ir.py
          python/triton_anchor/tests/test_hw_capability.py
          -v --tb=short
        env:
          PYTHONPATH: python
