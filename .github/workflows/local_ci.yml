name: Local CI Contracts

on:
  pull_request:
    branches: [main, develop, ai-ci]
  push:
    branches: [main, develop, jiwang-delivery-ci, ai-ci]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-ci-precheck:
    name: Local CI Contracts Precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Check Local CI scripts
        run: |
          bash -n scripts/local_ci/poll_gitee_and_run.sh
          bash -n scripts/local_ci/orchestration/run_deterministic_ci_in_container.sh
          bash -n scripts/local_ci/deterministic_ci/run_deterministic_ci.sh
          python -m py_compile scripts/local_ci/deterministic_ci/performance/compile_benchmark.py
          python -m py_compile scripts/local_ci/deterministic_ci/performance/common.py
          python -m py_compile scripts/local_ci/deterministic_ci/performance/compare_compile_time.py
          python -m py_compile scripts/local_ci/deterministic_ci/performance/ir_serialization_benchmark.py
          python -m py_compile scripts/local_ci/deterministic_ci/performance/compare_ir_serialization.py
          python -m py_compile scripts/local_ci/results/publish_gitee_result.py
          python -m py_compile scripts/local_ci/results/bridge_gitee_to_github_status.py
          python -m py_compile scripts/local_ci/shared/finding_locations.py

      - name: Check Local CI contracts
        run: >-
          python -m pytest
          scripts/local_ci/codex_ai/tests
          scripts/local_ci/tests/test_module_layout.py
          scripts/local_ci/results/tests
          -v --tb=short

      - name: Run Local CI shell contracts
        shell: bash
        run: |
          bash scripts/local_ci/codex_ai/tests/test_local_ci_codex_ai.sh
          bash scripts/local_ci/codex_ai/tests/test_local_ci_codex_container_setup.sh
          bash scripts/local_ci/codex_ai/tests/test_local_ci_codex_container.sh

      - name: Run Local CI Python contracts
        run: >-
          python -m pytest
          python/triton_anchor/tests/test_compile_time_regression.py
          python/triton_anchor/tests/test_dashboard_contract.py
          python/triton_anchor/tests/test_dashboard_sync.py
          python/triton_anchor/tests/test_pass_profile_regression.py
          python/triton_anchor/tests/test_profile_env.py
          -v --tb=short
        env:
          PYTHONPATH: python:scripts/local_ci

  performance-regression-contract:
    name: IR Serialization Performance Regression Contract
    runs-on: ubuntu-latest
    needs: local-ci-precheck
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Validate IR performance comparison and dashboard publishing
        run: >-
          python -m pytest
          python/triton_anchor/tests/test_ir_serialization_regression.py
          -v --tb=short
        env:
          PYTHONPATH: python:scripts/local_ci
