name: Local CI Contracts

on:
  push:
    paths: ['scripts/local_ci/**', 'scripts/ci/tests/**', '.github/**']
  pull_request:
    paths: ['scripts/local_ci/**', 'scripts/ci/tests/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Local CI admission, tools, runtime and result contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract test dependencies
        run: python -m pip install pytest PyYAML
      - name: Validate shell and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts/local_ci -type f -name '*.sh' -print0)
          python -m compileall -q scripts/local_ci
      - name: Run admission, evidence, policy and tool contracts
        env:
          PYTHONPATH: python:scripts/local_ci
        run: python -m pytest scripts/local_ci/tests scripts/ci/tests -v --tb=short
