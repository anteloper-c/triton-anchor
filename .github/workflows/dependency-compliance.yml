name: Dependency Compliance

on:
  push:
    branches: [main, CI_dev, t82-dependency-compliance]
    paths:
      - ".github/**"
      - ".gitignore"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "MANIFEST.in"
      - "compliance/**"
      - "csrc/**"
      - "envsetup.sh"
      - "FlagGems"
      - "LICENSE"
      - "pyproject.toml"
      - "README.md"
      - "ROADMAP.md"
      - "python/**"
      - "scripts/**"
      - "SECURITY.md"
      - "setup.py"
      - "THIRD_PARTY_NOTICES.md"
      - "assets/**"
      - "docs/**"
      - "tests/**"
      - "triton/**"
  pull_request:
    branches: [main, CI_dev, t82-dependency-compliance]
    paths:
      - ".gitmodules"
      - ".github/workflows/dependency-compliance.yml"
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - "**/third_party/**"
      - "FlagGems"
      - "compliance/**"
      - "pyproject.toml"
      - "python/**/*.py"
      - "scripts/compliance/**"
      - "setup.py"
      - "THIRD_PARTY_NOTICES.md"
      - "triton/cmake/llvm-hash.txt"
      - "triton/python/**/*.py"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run_audit:
        description: "Run the full dependency audit instead of candidate simulations"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-test:
    name: "T8.2 Compliance Core"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate compliance model, policy, and gates
        run: |
          python -m compileall -q scripts/compliance
          python -B -m unittest discover -s scripts/compliance/tests -t . -p "test_*.py" -v

  dependency-admission:
    name: "T8.2 Dependency Admission"
    needs: core-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize admission evidence paths
        run: |
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/t82-admission-evidence" >> "${GITHUB_ENV}"
          echo "TOOLS_DIR=${RUNNER_TEMP}/t82-admission-tools" >> "${GITHUB_ENV}"
          echo "BASELINE_ROOT=${RUNNER_TEMP}/t82-admission-baseline" >> "${GITHUB_ENV}"
          echo "CURRENT_ROOT=${RUNNER_TEMP}/t82-admission-current" >> "${GITHUB_ENV}"
          mkdir -p \
            "${RUNNER_TEMP}/t82-admission-evidence" \
            "${RUNNER_TEMP}/t82-admission-baseline" \
            "${RUNNER_TEMP}/t82-admission-current"

      - name: Generate the dependency declaration and registry delta
        id: admission-inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git archive "${BASE_SHA}" | tar -x -C "${BASELINE_ROOT}"
          git archive "${CURRENT_SHA}" | tar -x -C "${CURRENT_ROOT}"
          cp "${CURRENT_ROOT}/compliance/component-registry.json" \
            "${EVIDENCE_DIR}/proposed-component-registry.json"
          if [[ ! -f "${BASELINE_ROOT}/compliance/component-registry.json" || \
                ! -f "${BASELINE_ROOT}/scripts/compliance/cli.py" ]]; then
            echo "required=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## T8.2 dependency admission scope"
              echo
              echo "- Baseline registry available: \`false\`"
              echo "- Admission required: \`false\`"
              echo "- Result: \`not-applicable\` (initial T8.2 bootstrap)"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          (
            cd "${BASELINE_ROOT}"
            python -B -m scripts.compliance.declarations \
              --baseline-root "${BASELINE_ROOT}" \
              --current-root "${CURRENT_ROOT}" \
              --output "${EVIDENCE_DIR}/declaration-delta.json"
          )
          cp "${BASELINE_ROOT}/compliance/component-registry.json" \
            "${EVIDENCE_DIR}/baseline-component-registry.json"
          delta_count="$(python -c \
            'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8")).get("items", [])))' \
            "${EVIDENCE_DIR}/declaration-delta.json")"
          registry_changed=false
          if ! cmp -s \
            "${EVIDENCE_DIR}/baseline-component-registry.json" \
            "${EVIDENCE_DIR}/proposed-component-registry.json"; then
            registry_changed=true
          fi
          required=false
          if (( delta_count > 0 )) || [[ "${registry_changed}" == "true" ]]; then
            required=true
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          {
            echo "## T8.2 dependency admission scope"
            echo
            echo "- Baseline registry available: \`true\`"
            echo "- Admission required: \`${required}\`"
            echo "- Declaration delta items: \`${delta_count}\`"
            echo "- Registry file changed: \`${registry_changed}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install the pinned vulnerability scanner
        if: steps.admission-inputs.outputs.required == 'true'
        run: |
          bash "${BASELINE_ROOT}/scripts/compliance/bootstrap_tools.sh" \
            "${TOOLS_DIR}" osv \
            | tee "${EVIDENCE_DIR}/tool-versions.txt"

      - name: Evaluate dependency admission for both product targets
        if: steps.admission-inputs.outputs.required == 'true'
        run: |
          source "${TOOLS_DIR}/tools.env"
          overall_status=0
          for target in core-wheel source-snapshot; do
            set +e
            (
              cd "${BASELINE_ROOT}"
              python -B -m scripts.compliance.osv_runner \
                --scanner "${OSV_SCANNER}" \
                --baseline-registry "${EVIDENCE_DIR}/baseline-component-registry.json" \
                --registry "${EVIDENCE_DIR}/proposed-component-registry.json" \
                --raw-output "${EVIDENCE_DIR}/osv-${target}.raw.json" \
                --output "${EVIDENCE_DIR}/osv-${target}.json" \
                --target "${target}"
            )
            osv_status=$?
            (
              cd "${BASELINE_ROOT}"
              python -B -m scripts.compliance.cli admission \
                --baseline-registry "${EVIDENCE_DIR}/baseline-component-registry.json" \
                --registry "${EVIDENCE_DIR}/proposed-component-registry.json" \
                --policy "${BASELINE_ROOT}/compliance/license-policy.json" \
                --risk-acceptances "${BASELINE_ROOT}/compliance/risk-acceptances.json" \
                --declaration-delta "${EVIDENCE_DIR}/declaration-delta.json" \
                --osv "${EVIDENCE_DIR}/osv-${target}.json" \
                --target "${target}" \
                --output "${EVIDENCE_DIR}/admission-${target}.json"
            )
            admission_status=$?
            set -e
            if (( osv_status != 0 || admission_status != 0 )); then
              overall_status=1
            fi
          done
          exit "${overall_status}"

      - name: Upload dependency admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t82-admission-pr-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t82-admission-evidence/
          if-no-files-found: warn
          retention-days: 14

  source-snapshot-simulation:
    name: "T8.2 Source Snapshot Technical Simulation"
    needs: core-test
    if: >-
      github.repository == 'anteloper-c/triton-anchor' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_audit != true)
      ) &&
      github.ref == 'refs/heads/t82-dependency-compliance'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize source snapshot paths
        run: |
          echo "SOURCE_EVIDENCE_DIR=${RUNNER_TEMP}/t82-source-evidence" >> "${GITHUB_ENV}"
          echo "SOURCE_TOOLS_DIR=${RUNNER_TEMP}/t82-source-tools" >> "${GITHUB_ENV}"
          echo "SOURCE_ZIP=${RUNNER_TEMP}/source-snapshot.zip" >> "${GITHUB_ENV}"
          echo "SOURCE_TAR=${RUNNER_TEMP}/source-snapshot.tar.gz" >> "${GITHUB_ENV}"
          echo "SOURCE_EXTRACT_DIR=${RUNNER_TEMP}/source-snapshot-extracted" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/t82-source-evidence"

      - name: Install source scanning prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl libgomp1 libxml2-dev libz-dev xz-utils
          bash scripts/compliance/bootstrap_tools.sh "${SOURCE_TOOLS_DIR}" \
            | tee "${SOURCE_EVIDENCE_DIR}/tool-versions.txt"

      - name: Download and verify both commit archive representations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          curl -L --fail --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            --output "${SOURCE_ZIP}" \
            "${archive_api}/zipball/${GITHUB_SHA}"
          curl -L --fail --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            --output "${SOURCE_TAR}" \
            "${archive_api}/tarball/${GITHUB_SHA}"
          python -B -m scripts.compliance.source_snapshot \
            --source-zip "${SOURCE_ZIP}" \
            --source-tar "${SOURCE_TAR}" \
            --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --reference-kind commit \
            --reference "${GITHUB_SHA}" \
            --commit "${GITHUB_SHA}" \
            --version "${GITHUB_SHA}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --output "${SOURCE_EVIDENCE_DIR}/source-snapshot-artifact.json"

      - name: Extract one verified representation
        run: |
          mkdir -p "${SOURCE_EXTRACT_DIR}"
          tar -xzf "${SOURCE_TAR}" -C "${SOURCE_EXTRACT_DIR}"
          mapfile -d '' -t roots < <(
            find "${SOURCE_EXTRACT_DIR}" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#roots[@]} != 1 )); then
            echo "Expected one source archive root, found ${#roots[@]}" >&2
            exit 1
          fi
          echo "SOURCE_ROOT=${roots[0]}" >> "${GITHUB_ENV}"

      - name: Scan the verified source snapshot
        run: |
          source "${SOURCE_TOOLS_DIR}/tools.env"
          (
            cd "$(dirname "${SCANCODE}")"
            "${SCANCODE}" \
              --license --copyright --package --processes 2 \
              --json-pp "${SOURCE_EVIDENCE_DIR}/scancode-source.json" \
              "${SOURCE_ROOT}"
          )
          SYFT_CHECK_FOR_APP_UPDATE=false "${SYFT}" scan "dir:${SOURCE_ROOT}" \
            --quiet \
            --output "cyclonedx-json=${SOURCE_EVIDENCE_DIR}/syft-source.cdx.json"
          python -B -m scripts.compliance.declarations \
            --root "${SOURCE_ROOT}" \
            --output "${SOURCE_EVIDENCE_DIR}/dependency-inventory.json"

      - name: Query source snapshot vulnerabilities
        run: |
          source "${SOURCE_TOOLS_DIR}/tools.env"
          python -B -m scripts.compliance.osv_runner \
            --scanner "${OSV_SCANNER}" \
            --registry compliance/component-registry.json \
            --source-artifact "${SOURCE_EVIDENCE_DIR}/source-snapshot-artifact.json" \
            --dependency-inventory "${SOURCE_EVIDENCE_DIR}/dependency-inventory.json" \
            --raw-output "${SOURCE_EVIDENCE_DIR}/osv-scanner.raw.json" \
            --output "${SOURCE_EVIDENCE_DIR}/osv-results.json" \
            --target source-snapshot

      - name: Evaluate the commit source snapshot
        run: |
          set +e
          python -B -m scripts.compliance.cli artifact-evaluation \
            --source-zip "${SOURCE_ZIP}" \
            --source-tar "${SOURCE_TAR}" \
            --source-repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --source-reference-kind commit \
            --source-reference "${GITHUB_SHA}" \
            --source-commit "${GITHUB_SHA}" \
            --source-version "${GITHUB_SHA}" \
            --source-repository-root "${GITHUB_WORKSPACE}" \
            --registry compliance/component-registry.json \
            --policy compliance/license-policy.json \
            --risk-acceptances compliance/risk-acceptances.json \
            --scancode-source "${SOURCE_EVIDENCE_DIR}/scancode-source.json" \
            --syft "${SOURCE_EVIDENCE_DIR}/syft-source.cdx.json" \
            --osv "${SOURCE_EVIDENCE_DIR}/osv-results.json" \
            --dependency-inventory "${SOURCE_EVIDENCE_DIR}/dependency-inventory.json" \
            --notices THIRD_PARTY_NOTICES.md \
            --target source-snapshot \
            --output-dir "${SOURCE_EVIDENCE_DIR}/evaluation"
          evaluation_rc=$?
          set -e
          python - "${evaluation_rc}" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          evaluation_rc = int(sys.argv[1])
          evidence = Path(os.environ["SOURCE_EVIDENCE_DIR"])
          artifact = json.loads(
              (evidence / "source-snapshot-artifact.json").read_text()
          )
          report = json.loads(
              (evidence / "evaluation" / "compliance-report.json").read_text()
          )
          link = json.loads(
              (evidence / "evaluation" / "artifact-sbom-link.json").read_text()
          )
          coherent_exit = (
              evaluation_rc == 0
              and report.get("execution_status") == "pass"
              and report.get("compliance_status") == "pass"
          ) or (
              evaluation_rc == 1
              and (
                  report.get("execution_status") != "pass"
                  or report.get("compliance_status") != "pass"
              )
          )
          result = {
              "simulation": True,
              "not_a_release": True,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "reference_kind": "commit",
              "formal_tag_binding": False,
              "evaluation_exit_code": evaluation_rc,
              "execution_status": report.get("execution_status"),
              "evidence_status": report.get("evidence_status"),
              "compliance_status": report.get("compliance_status"),
              "sbom_inventory_status": report.get("sbom_inventory_status"),
              "promotion_status": report.get("promotion_status"),
          }
          (evidence / "source-simulation-result.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          if not coherent_exit:
              raise SystemExit("evaluation exit code and technical status disagree")
          if report.get("execution_status") != "pass":
              raise SystemExit("source scanners or component reconciliation failed")
          if report.get("evidence_status") != "complete":
              raise SystemExit("source snapshot evidence is incomplete")
          if report.get("promotion_status") != "not-applicable":
              raise SystemExit("commit simulation acquired promotion semantics")
          if report.get("artifact_evidence_binding") != "verified-commit":
              raise SystemExit("commit archive binding was not established")
          if artifact.get("sha256") != report.get("artifact", {}).get("sha256"):
              raise SystemExit("report does not identify the verified source tree")
          if link.get("artifact", {}).get("sha256") != artifact.get("sha256"):
              raise SystemExit("SBOM link does not identify the verified source tree")
          if {item.get("format") for item in link["artifact"]["representations"]} != {"zip", "tar.gz"}:
              raise SystemExit("SBOM link does not cover both source representations")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## T8.2 source snapshot technical simulation\n\n")
              summary.write(f"- Commit: `{os.environ.get('GITHUB_SHA')}`\n")
              summary.write(f"- Tree SHA256: `{artifact.get('sha256')}`\n")
              summary.write(f"- Execution: `{report.get('execution_status')}`\n")
              summary.write(f"- Evidence: `{report.get('evidence_status')}`\n")
              summary.write(f"- Compliance: `{report.get('compliance_status')}`\n")
              summary.write(f"- SBOM inventory: `{report.get('sbom_inventory_status')}`\n")
              summary.write("- This commit simulation is not a tag, candidate, or release.\n")
          PY

      - name: Write source evidence manifest
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["SOURCE_EVIDENCE_DIR"])
          reports = {}
          if evidence.exists():
              for path in sorted(evidence.rglob("*")):
                  if path.is_file() and path.name != "evidence-manifest.json":
                      reports[path.relative_to(evidence).as_posix()] = (
                          hashlib.sha256(path.read_bytes()).hexdigest()
                      )
          archives = []
          for variable, archive_format in (("SOURCE_ZIP", "zip"), ("SOURCE_TAR", "tar.gz")):
              path = Path(os.environ[variable])
              if path.is_file():
                  archives.append(
                      {
                          "filename": path.name,
                          "format": archive_format,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      }
                  )
          manifest = {
              "schema_version": 1,
              "simulation": True,
              "not_a_release": True,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "reference_kind": "commit",
              "formal_tag_binding": False,
              "archives": archives,
              "reports": reports,
          }
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "evidence-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload source snapshot simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t82-source-snapshot-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-snapshot.zip
            ${{ runner.temp }}/source-snapshot.tar.gz
            ${{ runner.temp }}/t82-source-evidence/
          if-no-files-found: warn
          retention-days: 14

  candidate-simulation:
    name: >-
      ${{ (github.event_name == 'schedule' || inputs.run_audit == true)
          && 'T8.2 Dependency Audit'
          || 'T8.2 Candidate Gate Simulation' }}
    needs: core-test
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_audit == true) ||
      (
        github.repository == 'anteloper-c/triton-anchor' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/t82-dependency-compliance'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AUDIT_MODE: ${{ github.event_name == 'schedule' || inputs.run_audit == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize compliance paths
        run: |
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/t82-evidence" >> "${GITHUB_ENV}"
          echo "TOOLS_DIR=${RUNNER_TEMP}/t82-tools" >> "${GITHUB_ENV}"
          echo "LLVM_BUILD_DIR=${RUNNER_TEMP}/llvm-release" >> "${GITHUB_ENV}"
          echo "WORKSPACE=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/t82-evidence"

      - name: Install build and scan prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential cmake curl libgomp1 libxml2-dev libz-dev \
            libzstd-dev ninja-build pkg-config python3-dev unzip xz-utils
          python -m pip install --upgrade pip uv==0.12.8
          uv pip install --system --upgrade pybind11 setuptools wheel
          mkdir -p "${EVIDENCE_DIR}"
          python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import subprocess
          import sys

          roots = ("pybind11", "setuptools", "uv", "wheel")
          requirements = [
              f"{name}=={importlib.metadata.version(name)}" for name in roots
          ]
          report = Path(os.environ["EVIDENCE_DIR"]) / "python-build-environment.json"
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--dry-run",
                  "--ignore-installed",
                  "--quiet",
                  "--report",
                  str(report),
                  *requirements,
              ],
              check=True,
          )
          PY

      - name: Restore the matching LLVM build
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-release
          key: llvm-10dc3a8e-ubuntu-x64-462b23d05829

      - name: Download the matching LLVM build
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          archive="${RUNNER_TEMP}/llvm-10dc3a8e-ubuntu-x64.tar.gz"
          curl -L --fail --retry 3 \
            --output "${archive}" \
            https://oaitriton.blob.core.windows.net/public/llvm-builds/llvm-10dc3a8e-ubuntu-x64.tar.gz
          echo "462b23d05829f759aac6b07fb98cc863082bd925026fe99df3396d245677e80b  ${archive}" \
            | sha256sum -c -
          mkdir -p "${LLVM_BUILD_DIR}"
          tar -xzf "${archive}" -C "${LLVM_BUILD_DIR}" --strip-components=1

      - name: Verify the LLVM input and install scanners
        run: |
          set -o pipefail
          test "$(tr -d '\r\n' < triton/cmake/llvm-hash.txt)" = \
            "10dc3a8e916d73291269e5e2b82dd22681489aa1"
          "${LLVM_BUILD_DIR}/bin/llvm-config" --version
          bash scripts/compliance/bootstrap_tools.sh "${TOOLS_DIR}" \
            | tee "${EVIDENCE_DIR}/tool-versions.txt"

      - name: Scan the source tree
        run: |
          source "${TOOLS_DIR}/tools.env"
          (
            cd "$(dirname "${SCANCODE}")"
            "${SCANCODE}" \
              --license --copyright --package --processes 2 \
              --ignore '.git/**' \
              --ignore '*/compliance/**' \
              --ignore '*/scripts/compliance/**' \
              --ignore '*/THIRD_PARTY_NOTICES.md' \
              --json-pp "${EVIDENCE_DIR}/scancode-source.json" \
              "${GITHUB_WORKSPACE}"
          )

      - name: Build exactly one Wheel and collect same-build evidence
        id: wheel
        run: |
          export CXX=/usr/bin/g++
          build_tools="${RUNNER_TEMP}/t82-build-tools"
          mkdir -p "${build_tools}"
          ln -s /usr/bin/cmake "${build_tools}/cmake"
          ln -s /usr/bin/ninja "${build_tools}/ninja"
          export PATH="${build_tools}:${PATH}"
          source ./envsetup.sh
          export MAX_JOBS=4
          cpython_version="$(python -c 'import platform; print(platform.python_version())')"
          cpython_tag="refs/tags/v${cpython_version}"
          cpython_refs="$(
            git ls-remote https://github.com/python/cpython.git \
              "${cpython_tag}" "${cpython_tag}^{}"
          )"
          cpython_source_commit="$(
            printf '%s\n' "${cpython_refs}" |
              awk -v exact="${cpython_tag}" -v peeled="${cpython_tag}^{}" '
                $2 == peeled { print $1; found = 1; exit }
                $2 == exact { fallback = $1 }
                END { if (!found && fallback) print fallback }
              '
          )"
          if [[ ! "${cpython_source_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve CPython ${cpython_version} release tag" >&2
            exit 1
          fi
          gcc_major="$("${CXX}" -dumpversion | cut -d. -f1)"
          if [[ ! "${gcc_major}" =~ ^[0-9]+$ ]]; then
            echo "Cannot determine the configured GCC package" >&2
            exit 1
          fi
          uv build --wheel --no-build-isolation
          mapfile -d '' -t wheels < <(
            find dist -maxdepth 1 -type f -name 'triton_anchor-*.whl' -print0
          )
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one triton-anchor Wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheel_path="$(realpath "${wheels[0]}")"
          echo "WHEEL_PATH=${wheel_path}" >> "${GITHUB_ENV}"
          echo "wheel_path=${wheel_path}" >> "${GITHUB_OUTPUT}"
          python -B -m scripts.compliance.build_evidence \
            --wheel "${wheel_path}" \
            --source-root "${GITHUB_WORKSPACE}" \
            --evidence-binding same-build \
            --cxx-compiler "${CXX}" \
            --package-tool uv \
            --python-build-report "${EVIDENCE_DIR}/python-build-environment.json" \
            --ubuntu-package "gcc-toolchain=g++-${gcc_major}" \
            --ubuntu-package glibc=libc6 \
            --ubuntu-package cmake=cmake \
            --ubuntu-package ninja=ninja-build \
            --ubuntu-package zlib=zlib1g \
            --ubuntu-package zstd=libzstd1 \
            --cpython-source-commit "${cpython_source_commit}" \
            --output "${EVIDENCE_DIR}/build-evidence.json"

      - name: Scan the built Wheel
        run: |
          source "${TOOLS_DIR}/tools.env"
          wheel_scan_sha256="$(sha256sum -- "${WHEEL_PATH}" | cut -d ' ' -f 1)"
          build_sha256="$(
            python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["compliance_build"]["artifact_sha256"])' \
              "${EVIDENCE_DIR}/build-evidence.json"
          )"
          if [[ "${wheel_scan_sha256}" != "${build_sha256}" ]]; then
            echo "Wheel changed after same-build evidence was recorded" >&2
            exit 1
          fi
          unpacked="${RUNNER_TEMP}/t82-wheel-unpacked"
          mkdir -p "${unpacked}"
          python -m zipfile -e "${WHEEL_PATH}" "${unpacked}"
          (
            cd "$(dirname "${SCANCODE}")"
            "${SCANCODE}" \
              --license --copyright --package --processes 2 \
              --ignore '*libtriton.so' \
              --json-pp "${EVIDENCE_DIR}/scancode-wheel.json" \
              "${unpacked}"
          )
          SYFT_CHECK_FOR_APP_UPDATE=false "${SYFT}" scan "dir:${unpacked}" \
            --quiet \
            --output "cyclonedx-json=${EVIDENCE_DIR}/syft-wheel.cdx.json"
          post_scan_sha256="$(sha256sum -- "${WHEEL_PATH}" | cut -d ' ' -f 1)"
          if [[ "${post_scan_sha256}" != "${wheel_scan_sha256}" ]]; then
            echo "Wheel changed while its scanner reports were generated" >&2
            exit 1
          fi
          echo "WHEEL_SCAN_SHA256=${wheel_scan_sha256}" >> "${GITHUB_ENV}"

      - name: Query current vulnerabilities
        run: |
          source "${TOOLS_DIR}/tools.env"
          python -B -m scripts.compliance.osv_runner \
            --scanner "${OSV_SCANNER}" \
            --registry compliance/component-registry.json \
            --build-evidence "${EVIDENCE_DIR}/build-evidence.json" \
            --raw-output "${EVIDENCE_DIR}/osv-scanner.raw.json" \
            --output "${EVIDENCE_DIR}/osv-results.json" \
            --target core-wheel

      - name: Run the full dependency audit
        if: github.event_name == 'schedule' || inputs.run_audit == true
        run: |
          mkdir -p "${EVIDENCE_DIR}/audit"
          python -B -m scripts.compliance.declarations \
            --root "${GITHUB_WORKSPACE}" \
            --output "${EVIDENCE_DIR}/dependency-inventory.json"
          python -B -m scripts.compliance.cli audit \
            --registry compliance/component-registry.json \
            --policy compliance/license-policy.json \
            --risk-acceptances compliance/risk-acceptances.json \
            --scancode "${EVIDENCE_DIR}/scancode-source.json" \
            --syft "${EVIDENCE_DIR}/syft-wheel.cdx.json" \
            --osv "${EVIDENCE_DIR}/osv-results.json" \
            --build-evidence "${EVIDENCE_DIR}/build-evidence.json" \
            --dependency-inventory "${EVIDENCE_DIR}/dependency-inventory.json" \
            --target core-wheel \
            --output "${EVIDENCE_DIR}/audit/compliance-audit.json"

      - name: Generate the audited Wheel SBOM
        if: >-
          always() &&
          (github.event_name == 'schedule' || inputs.run_audit == true)
        run: |
          set +e
          python -B -m scripts.compliance.cli artifact-evaluation \
            --wheel "${WHEEL_PATH}" \
            --registry compliance/component-registry.json \
            --policy compliance/license-policy.json \
            --risk-acceptances compliance/risk-acceptances.json \
            --scancode-source "${EVIDENCE_DIR}/scancode-source.json" \
            --scancode-wheel "${EVIDENCE_DIR}/scancode-wheel.json" \
            --syft "${EVIDENCE_DIR}/syft-wheel.cdx.json" \
            --osv "${EVIDENCE_DIR}/osv-results.json" \
            --build-evidence "${EVIDENCE_DIR}/build-evidence.json" \
            --notices THIRD_PARTY_NOTICES.md \
            --target core-wheel \
            --output-dir "${EVIDENCE_DIR}/audit/artifact-evaluation"
          evaluation_rc=$?
          set -e
          python - "${evaluation_rc}" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          evaluation_rc = int(sys.argv[1])
          output = (
              Path(os.environ["EVIDENCE_DIR"])
              / "audit"
              / "artifact-evaluation"
          )
          report = json.loads((output / "compliance-report.json").read_text())
          sboms = list(output.glob("*.whl.cdx.json"))
          if evaluation_rc not in (0, 1):
              raise SystemExit("artifact evaluation returned an invalid exit code")
          if report.get("execution_status") != "pass":
              raise SystemExit("the audited Wheel SBOM evaluation did not execute")
          if report.get("evidence_status") != "complete":
              raise SystemExit("the audited Wheel SBOM evidence is incomplete")
          if len(sboms) != 1 or not (output / "artifact-sbom-link.json").is_file():
              raise SystemExit("the audited Wheel SBOM outputs are incomplete")
          PY

      - name: Evaluate the simulated candidate
        if: github.event_name != 'schedule' && inputs.run_audit != true
        run: |
          set +e
          python -B -m scripts.compliance.cli candidate \
            --wheel "${WHEEL_PATH}" \
            --registry compliance/component-registry.json \
            --policy compliance/license-policy.json \
            --risk-acceptances compliance/risk-acceptances.json \
            --scancode-source "${EVIDENCE_DIR}/scancode-source.json" \
            --scancode-wheel "${EVIDENCE_DIR}/scancode-wheel.json" \
            --syft "${EVIDENCE_DIR}/syft-wheel.cdx.json" \
            --osv "${EVIDENCE_DIR}/osv-results.json" \
            --build-evidence "${EVIDENCE_DIR}/build-evidence.json" \
            --notices THIRD_PARTY_NOTICES.md \
            --target core-wheel \
            --output-dir "${EVIDENCE_DIR}/candidate"
          candidate_rc=$?
          set -e
          python - "${candidate_rc}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          candidate_rc = int(sys.argv[1])
          evidence = Path(os.environ["EVIDENCE_DIR"])
          wheel = Path(os.environ["WHEEL_PATH"])
          report = json.loads(
              (evidence / "candidate" / "compliance-report.json").read_text()
          )
          candidate_output = evidence / "candidate"
          sboms = list(candidate_output.glob("*.whl.cdx.json"))
          policy = json.loads(Path("compliance/license-policy.json").read_text())
          wheel_sha256 = hashlib.sha256(wheel.read_bytes()).hexdigest()
          reported_sha256 = report.get("artifact", {}).get("sha256")
          promotion = report.get("promotion_status")
          coherent_exit = (
              candidate_rc == 0 and promotion == "pass"
          ) or (
              candidate_rc == 1 and promotion == "blocked"
          )
          result = {
              "simulation": True,
              "not_a_release": True,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "wheel": wheel.name,
              "wheel_sha256": wheel_sha256,
              "candidate_exit_code": candidate_rc,
              "execution_status": report.get("execution_status"),
              "evidence_status": report.get("evidence_status"),
              "compliance_status": report.get("compliance_status"),
              "sbom_inventory_status": report.get("sbom_inventory_status"),
              "promotion_status": promotion,
          }
          (evidence / "simulation-result.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## T8.2 candidate gate simulation\n\n")
              summary.write(f"- Wheel: `{wheel.name}`\n")
              summary.write(f"- SHA256: `{wheel_sha256}`\n")
              summary.write(f"- Execution: `{report.get('execution_status')}`\n")
              summary.write(f"- Evidence: `{report.get('evidence_status')}`\n")
              summary.write(f"- Compliance: `{report.get('compliance_status')}`\n")
              summary.write(f"- SBOM inventory: `{report.get('sbom_inventory_status')}`\n")
              summary.write(f"- Simulated promotion: `{promotion}`\n")
              summary.write("- This run does not publish or release the Wheel.\n")
          if not coherent_exit:
              raise SystemExit("candidate exit code and promotion status disagree")
          if report.get("execution_status") != "pass":
              raise SystemExit("the scanner/evidence execution did not complete")
          if report.get("evidence_status") != "complete":
              raise SystemExit("the simulated candidate evidence is incomplete")
          if report.get("build_evidence_binding") != "same-build":
              raise SystemExit("same-build binding was not established")
          if reported_sha256 != wheel_sha256:
              raise SystemExit("candidate report does not identify the built Wheel")
          if len(sboms) != 1 or not (
              candidate_output / "artifact-sbom-link.json"
          ).is_file():
              raise SystemExit("candidate SBOM outputs are incomplete")
          if policy.get("status") != "approved":
              policy_blocked = any(
                  blocker.get("reason")
                  == "license and vulnerability policy is not approved"
                  for blocker in report.get("compliance_blockers", [])
              )
              if promotion != "blocked" or not policy_blocked:
                  raise SystemExit("the pending policy did not block promotion")
          PY

      - name: Write the evidence manifest
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          audit_mode = os.environ.get("AUDIT_MODE", "").lower() == "true"
          reports = {}
          if evidence.exists():
              for path in sorted(evidence.rglob("*")):
                  if path.is_file() and path.name != "evidence-manifest.json":
                      reports[path.relative_to(evidence).as_posix()] = (
                          hashlib.sha256(path.read_bytes()).hexdigest()
                      )
          manifest = {
              "schema_version": 1,
              "audit_run": audit_mode,
              "simulation": not audit_mode,
              "not_a_release": True,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "wheel": None,
              "wheel_scan": None,
              "reports": reports,
          }
          wheel_value = os.environ.get("WHEEL_PATH")
          if wheel_value and Path(wheel_value).is_file():
              wheel = Path(wheel_value)
              manifest["wheel"] = {
                  "filename": wheel.name,
                  "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              }
          scan_sha256 = os.environ.get("WHEEL_SCAN_SHA256")
          report_path = evidence / (
              "audit/artifact-evaluation/compliance-report.json"
              if audit_mode
              else "candidate/compliance-report.json"
          )
          if scan_sha256 and report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              binding = report.get("artifact_scan_evidence")
              if not isinstance(binding, dict):
                  raise SystemExit("Wheel scan evidence binding is missing")
              artifact = binding.get("artifact")
              if artifact != manifest["wheel"] or artifact.get("sha256") != scan_sha256:
                  raise SystemExit("Wheel scan evidence identifies a different artifact")
              for item in binding.get("reports", []):
                  filename = item.get("filename")
                  if reports.get(filename) != item.get("sha256"):
                      raise SystemExit(
                          f"Wheel scan report digest does not match: {filename}"
                      )
              manifest["wheel_scan"] = {
                  **binding,
                  "pre_scan_sha256": scan_sha256,
                  "post_scan_sha256": manifest["wheel"]["sha256"],
              }
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "evidence-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Wheel compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ (github.event_name == 'schedule' || inputs.run_audit == true)
                && 't82-audit'
                || 't82-simulation' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/triton_anchor-*.whl
            ${{ runner.temp }}/t82-evidence/
          if-no-files-found: warn
          retention-days: 14
