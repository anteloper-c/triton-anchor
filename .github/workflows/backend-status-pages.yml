name: Backend Status Pages
run-name: ${{ inputs.run_title || github.event.pull_request.title || github.event.head_commit.message || format('Dashboard on {0}', github.ref_name) }}

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "dashboard/**"
      - "scripts/dashboard/**"
      - "scripts/local_ci/shared/result_paths.py"
      - "python/triton_anchor/tests/test_dashboard_*.py"
      - ".github/workflows/backend-status-pages.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "scripts/dashboard/**"
      - "scripts/local_ci/shared/result_paths.py"
      - "python/triton_anchor/tests/test_dashboard_*.py"
      - ".github/workflows/backend-status-pages.yml"
  workflow_dispatch:
    inputs:
      run_title:
        description: "Optional title for a manual Dashboard run"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      source_branch:
        required: true
        type: string
      task_ref:
        required: true
        type: string
      run_title:
        required: false
        default: ""
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Fetch live Gitee CI results
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITEE_RESULTS_OWNER: ${{ vars.GITEE_RESULTS_OWNER || vars.GITEE_OWNER || 'likehupochuan' }}
          GITEE_RESULTS_REPO: ${{ vars.GITEE_RESULTS_REPO || 'triton-anchor-local-ci-results' }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
          GITEE_RESULTS_BRANCH: ${{ vars.GITEE_RESULTS_BRANCH || 'local-ci-results' }}
          GITEE_WORKER_HEALTH_BRANCH: ${{ vars.GITEE_WORKER_HEALTH_BRANCH || 'worker-health/sophgo-cmodel-01' }}
          GITEE_RESULTS_WEB_URL: ${{ vars.GITEE_RESULTS_WEB_URL || 'https://gitee.com/likehupochuan/triton-anchor-local-ci-results' }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          DASHBOARD_SOURCE_BRANCH: ${{ vars.DASHBOARD_SOURCE_BRANCH || format('ci/push/{0}', vars.LOCAL_CI_PAGES_BRANCH || 'CI_dev') }}
          DASHBOARD_FULL_TEST_SOURCE_BRANCH: ${{ vars.DASHBOARD_FULL_TEST_SOURCE_BRANCH || format('ci/full/{0}', vars.LOCAL_CI_PAGES_BRANCH || 'CI_dev') }}
          BACKEND_PROFILE: ${{ vars.LOCAL_CI_BACKEND_PROFILE || 'sophgo-cmodel' }}
          WORKER_HEALTH_STALE_SECONDS: ${{ vars.LOCAL_CI_WORKER_HEALTH_STALE_SECONDS || '1200' }}
        run: |
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "GITEE_TOKEN is empty"
            exit 1
          fi

          repo_url="${GITEE_RESULTS_REPO_URL:-https://gitee.com/${GITEE_RESULTS_OWNER}/${GITEE_RESULTS_REPO}.git}"
          askpass="${RUNNER_TEMP}/gitee-askpass.sh"
          cat > "${askpass}" <<'SH'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "${GITEE_USERNAME}" ;;
            *) printf '%s\n' "${GITEE_TOKEN}" ;;
          esac
          SH
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git clone --depth 1 --branch "${GITEE_RESULTS_BRANCH}" \
              "${repo_url}" "${RUNNER_TEMP}/gitee-results"
          health_args=()
          if GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git clone --depth 1 --branch "${GITEE_WORKER_HEALTH_BRANCH}" \
              "${repo_url}" "${RUNNER_TEMP}/gitee-worker-health"; then
            health_args=(
              --worker-health-file "${RUNNER_TEMP}/gitee-worker-health/worker-health.json"
            )
          else
            echo "Worker health snapshot is unavailable; Dashboard will show unknown status."
          fi
          python scripts/dashboard/sync_gitee_results.py \
            --results-dir "${RUNNER_TEMP}/gitee-results" \
            --output-dir dashboard/data \
            --source-branch "${DASHBOARD_SOURCE_BRANCH}" \
            --full-test-source-branch "${DASHBOARD_FULL_TEST_SOURCE_BRANCH}" \
            --profile "${BACKEND_PROFILE}" \
            --results-branch "${GITEE_RESULTS_BRANCH}" \
            --results-web-url "${GITEE_RESULTS_WEB_URL}" \
            --worker-health-stale-seconds "${WORKER_HEALTH_STALE_SECONDS}" \
            "${health_args[@]}"

      - name: Validate dashboard data contracts
        run: |
          python -m unittest \
            python/triton_anchor/tests/test_dashboard_contract.py \
            python/triton_anchor/tests/test_dashboard_sync.py \
            -v

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R dashboard/. _site/
          test -f _site/index.html
          test -f _site/data/manifest.json

      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy dashboard
    if: ${{ github.event_name != 'pull_request' && github.ref_name == (vars.LOCAL_CI_PAGES_BRANCH || 'CI_dev') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
