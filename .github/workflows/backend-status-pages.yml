name: Backend Status Pages

on:
  push:
    branches: [jiwang-delivery-ci, main,feat/backend-status-pages]
    paths:
      - "dashboard/**"
      - "scripts/dashboard/**"
      - "python/triton_anchor/tests/test_dashboard_contract.py"
      - ".github/workflows/backend-status-pages.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "scripts/dashboard/**"
      - "python/triton_anchor/tests/test_dashboard_contract.py"
      - ".github/workflows/backend-status-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Validate dashboard data contracts
        run: python -m unittest python/triton_anchor/tests/test_dashboard_contract.py -v

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R dashboard/. _site/
          test -f _site/index.html
          test -f _site/data/manifest.json

      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy dashboard
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
