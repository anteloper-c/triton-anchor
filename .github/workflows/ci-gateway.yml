name: CI Gateway
run-name: Local CI gateway | ${{ inputs.pr_number || github.event.pull_request.number || github.ref_name }}
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed, converted_to_draft, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [request, run]
        default: request
      pr_number: {type: string, default: '0'}
      source_branch: {type: string, default: ''}
      requested_sha: {type: string, default: ''}
      worker_revision_sha: {type: string, default: ''}
      action: {type: string, default: ''}
      full: {type: boolean, default: false}
permissions: {}
concurrency:
  group: ci-v4-${{ inputs.mode || github.event_name }}-${{ inputs.pr_number != '0' && inputs.pr_number || github.event.pull_request.number || inputs.source_branch || github.ref_name }}
  cancel-in-progress: true
jobs:
  route:
    if: >-
      (github.repository == 'likehupochuan/triton-anchor' || github.repository == 'anteloper-c/triton-anchor') &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'request')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: write}
    steps:
      - name: Route to local-ci-unified
        uses: actions/github-script@v7
        env:
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_BRANCH: ${{ inputs.source_branch }}
          INPUT_SHA: ${{ inputs.requested_sha }}
          INPUT_FULL: ${{ inputs.full }}
        with:
          script: |
            const {owner, repo} = context.repo;
            let pull = context.payload.pull_request;
            if (!pull && Number(process.env.INPUT_PR) > 0) {
              ({data: pull} = await github.rest.pulls.get({owner, repo, pull_number: Number(process.env.INPUT_PR)}));
            }
            const branch = process.env.INPUT_BRANCH || (pull?.base.ref || context.ref.replace('refs/heads/', ''));
            if (context.eventName === 'push') {
              const {data: pulls} = await github.rest.pulls.list({owner, repo, state:'open', head:owner+':'+branch, per_page:100});
              if (pulls.some(pr => !pr.draft && pr.head.sha === context.sha)) {
                core.info('The ready PR event owns this revision; avoid a duplicate branch task.');
                return;
              }
            }
            const controlRef = 'local-ci-unified';
            const {data: release} = await github.rest.repos.getBranch({owner, repo, branch: controlRef});
            const revision = release.commit.sha;
            const {data: file} = await github.rest.repos.getContent({owner, repo, path: '.github/ci-gateway-manifest.json', ref: revision});
            const manifest = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (manifest.gateway_contract_version !== '4') throw new Error('Deploy local-ci-unified v4 before the router');
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'ci-gateway.yml', ref: controlRef,
              inputs: {
                mode: 'run',
                pr_number: String(pull?.number || process.env.INPUT_PR || '0'),
                source_branch: branch,
                requested_sha: pull?.head.sha || process.env.INPUT_SHA || (context.eventName === 'push' ? context.sha : ''),
                worker_revision_sha: revision, action: context.eventName === 'workflow_dispatch' ? 'manual' : context.payload.action || '',
                full: process.env.INPUT_FULL || 'false'
              }
            });
  cancel-obsolete:
    needs: validate-worker
    if: >-
      (github.repository == 'likehupochuan/triton-anchor' || github.repository == 'anteloper-c/triton-anchor') &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'run' &&
      github.ref_name == 'local-ci-unified'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Notify local workers about obsolete tasks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 scripts/ci/gateway_v4.py cancel
  prepare:
    needs: cancel-obsolete
    if: ${{ inputs.action != 'closed' && inputs.action != 'converted_to_draft' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write}
    outputs:
      task_digest: ${{ steps.task.outputs.task_digest }}
      tested_sha: ${{ steps.task.outputs.tested_sha }}
      head_sha: ${{ steps.task.outputs.head_sha }}
      base_sha: ${{ steps.task.outputs.base_sha }}
      external_fork: ${{ steps.task.outputs.external_fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Freeze exact task and candidate LLVM
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_SHA: ${{ inputs.worker_revision_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
          FULL: ${{ inputs.full }}
          GITEE_SUBMODULE_MIRRORS: ${{ vars.GITEE_SUBMODULE_MIRRORS || '{}' }}
          EVENT_KIND: ${{ inputs.action == 'manual' && 'manual' || 'push' }}
        run: python3 scripts/ci/gateway_v4.py prepare
      - uses: actions/upload-artifact@v4
        with: {name: ci-v4-task, path: task.json}
      - name: Validate required PR information
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/gateway_v4.py info
  basic:
    needs: prepare
    permissions: {contents: read}
    uses: ./.github/workflows/ci_basic.yml
    with:
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
  api:
    needs: [prepare, basic]
    permissions: {contents: read}
    uses: ./.github/workflows/api-compat.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
  security:
    needs: [prepare, api]
    permissions: {contents: read, security-events: write}
    uses: ./.github/workflows/security-gate.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
  review-card:
    needs: [prepare, basic, api, security]
    if: ${{ always() && needs.prepare.outputs.tested_sha != '' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: read}
    outputs:
      eligible: ${{ steps.card.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: ci-v4-task}
      - name: Publish preflight evidence and approval review card
        id: card
        env:
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          GH_TOKEN: ${{ github.token }}
          STAGES: '{"prepare":"${{ needs.prepare.result }}","basic":"${{ needs.basic.result }}","api":"${{ needs.api.result }}","security":"${{ needs.security.result }}"}'
        run: python3 scripts/ci/gateway_v4.py card
  approve-external-fork:
    needs: [prepare, review-card]
    if: ${{ needs.review-card.outputs.eligible == 'true' && needs.prepare.outputs.external_fork == 'true' }}
    environment: local-ci-fork-approval
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: ci-v4-task}
      - name: Verify required reviewers and the approved PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: python3 scripts/ci/gateway_v4.py approval
  enqueue:
    needs: [prepare, review-card, approve-external-fork]
    if: >-
      always() && needs.review-card.outputs.eligible == 'true' &&
      (needs.prepare.outputs.external_fork != 'true' || needs.approve-external-fork.result == 'success')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: ci-v4-task}
      - name: Revalidate approval and publish code then immutable task
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          GH_TOKEN: ${{ github.token }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 trusted/scripts/ci/gateway_v4.py enqueue
  validate-worker:
    if: >-
      (github.repository == 'likehupochuan/triton-anchor' || github.repository == 'anteloper-c/triton-anchor') &&
      github.event_name == 'workflow_dispatch' && inputs.mode != 'request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the routed trusted worker revision
        env:
          WORKER_SHA: ${{ inputs.worker_revision_sha }}
        run: |
          test "$GITHUB_REF_NAME" = local-ci-unified
          test "$GITHUB_SHA" = "$WORKER_SHA"
