name: CI Gateway
run-name: >-
  CI v4 | ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'service' && 'service' || github.event_name == 'workflow_dispatch' && inputs.mode == 'run' && (inputs.action == 'closed' || inputs.action == 'converted_to_draft') && 'cancel' || github.event_name == 'workflow_dispatch' && inputs.mode == 'run' && 'run' || 'route' }} | ${{ (inputs.pr_number != '' && inputs.pr_number != '0' && format('PR {0}', inputs.pr_number)) || (github.event.pull_request.number && format('PR {0}', github.event.pull_request.number)) || (inputs.mode == 'service' && 'receiver') || format('branch {0}', inputs.source_branch || github.ref_name) }}
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed, converted_to_draft, labeled, unlabeled]
  push:
    branches: [main, CI_dev]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [request, run, service]
        default: request
      pr_number: {type: string, default: '0'}
      source_branch: {type: string, default: ''}
      requested_sha: {type: string, default: ''}
      worker_revision_sha: {type: string, default: ''}
      action: {type: string, default: ''}
      full: {type: boolean, default: false}
permissions: {}
concurrency:
  group: ci-v4-${{ inputs.mode || github.event_name }}-${{ inputs.pr_number != '0' && inputs.pr_number || github.event.pull_request.number || inputs.source_branch || github.ref_name }}
  cancel-in-progress: ${{ inputs.mode != 'service' }}
jobs:
  route:
    if: >-
      github.repository == 'likehupochuan/triton-anchor' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'request')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: write}
    steps:
      - name: Route to the trusted CI_dev implementation
        uses: actions/github-script@v7
        env:
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_BRANCH: ${{ inputs.source_branch }}
          INPUT_SHA: ${{ inputs.requested_sha }}
          INPUT_FULL: ${{ inputs.full }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull = context.payload.pull_request;
            if (pull?.base.ref === 'CI_dev_forPR') return;
            const branch = process.env.INPUT_BRANCH || (pull?.base.ref || context.ref.replace('refs/heads/', ''));
            if (branch === 'CI_dev_forPR') throw new Error('Excluded target branch');
            if (context.eventName === 'push') {
              const {data: pulls} = await github.rest.pulls.list({owner, repo, state:'open', head:owner+':'+branch, per_page:100});
              if (pulls.some(pr => !pr.draft && pr.head.sha === context.sha && pr.base.ref !== 'CI_dev_forPR')) {
                core.info('The ready PR event owns this revision; avoid a duplicate branch task.');
                return;
              }
            }
            const {data: worker} = await github.rest.repos.getBranch({owner, repo, branch: 'CI_dev'});
            const revision = worker.commit.sha;
            const {data: file} = await github.rest.repos.getContent({owner, repo, path: '.github/ci-gateway-manifest.json', ref: revision});
            const manifest = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (manifest.gateway_contract_version !== '4') throw new Error('Deploy CI_dev v4 before the router');
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'ci-gateway.yml', ref: 'CI_dev',
              inputs: {
                mode: context.eventName === 'schedule' ? 'service' : 'run',
                pr_number: String(pull?.number || process.env.INPUT_PR || '0'),
                source_branch: branch,
                requested_sha: pull?.head.sha || process.env.INPUT_SHA || (context.eventName === 'push' ? context.sha : ''),
                worker_revision_sha: revision, action: context.eventName === 'workflow_dispatch' ? 'manual' : context.payload.action || '',
                full: process.env.INPUT_FULL || 'false'
              }
            });
  cancel-obsolete:
    needs: validate-worker
    if: >-
      github.repository == 'likehupochuan/triton-anchor' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'run' &&
      github.ref_name == 'CI_dev'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, issues: write, statuses: write, checks: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Notify local workers about obsolete tasks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 scripts/ci/gateway_v4.py cancel
  prepare:
    needs: cancel-obsolete
    if: ${{ inputs.action != 'closed' && inputs.action != 'converted_to_draft' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, issues: write, statuses: write}
    outputs:
      task_digest: ${{ steps.task.outputs.task_digest }}
      tested_sha: ${{ steps.task.outputs.tested_sha }}
      head_sha: ${{ steps.task.outputs.head_sha }}
      base_sha: ${{ steps.task.outputs.base_sha }}
      external_fork: ${{ steps.task.outputs.external_fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Freeze exact task and candidate LLVM
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_SHA: ${{ inputs.worker_revision_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
          FULL: ${{ inputs.full }}
          EVENT_KIND: ${{ inputs.action == 'manual' && 'manual' || 'push' }}
        run: python3 scripts/ci/gateway_v4.py prepare
      - uses: actions/upload-artifact@v4
        with: {name: ci-v4-task, path: task.json}
      - name: Validate required PR information
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/gateway_v4.py info
  basic:
    needs: prepare
    permissions: {contents: read}
    uses: ./.github/workflows/ci_basic.yml
    with:
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
  api:
    needs: [prepare, basic]
    permissions: {contents: read}
    uses: ./.github/workflows/api-compat.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
  security:
    needs: [prepare, api]
    permissions: {contents: read, security-events: write}
    uses: ./.github/workflows/security-gate.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
  review-card:
    needs: [prepare, basic, api, security]
    if: ${{ always() && needs.prepare.outputs.tested_sha != '' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, issues: write, statuses: write, checks: write, actions: read}
    outputs:
      eligible: ${{ steps.card.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: ci-v4-task}
      - name: Publish preflight evidence and approval review card
        id: card
        env:
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          GH_TOKEN: ${{ github.token }}
          STAGES: '{"prepare":"${{ needs.prepare.result }}","basic":"${{ needs.basic.result }}","api":"${{ needs.api.result }}","security":"${{ needs.security.result }}"}'
        run: python3 scripts/ci/gateway_v4.py card
  approve-external-fork:
    needs: [prepare, review-card]
    if: ${{ needs.review-card.outputs.eligible == 'true' && needs.prepare.outputs.external_fork == 'true' }}
    environment: local-ci-fork-approval
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: ci-v4-task}
      - name: Verify required reviewers and the approved PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: python3 scripts/ci/gateway_v4.py approval
  enqueue:
    needs: [prepare, review-card, approve-external-fork]
    if: >-
      always() && needs.review-card.outputs.eligible == 'true' &&
      (needs.prepare.outputs.external_fork != 'true' || needs.approve-external-fork.result == 'success')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, issues: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: ci-v4-task}
      - name: Revalidate approval and publish code then immutable task
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          GH_TOKEN: ${{ github.token }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 trusted/scripts/ci/gateway_v4.py enqueue
  service:
    needs: validate-worker
    concurrency:
      group: ci-v4-service
      cancel-in-progress: false
    if: >-
      github.repository == 'likehupochuan/triton-anchor' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'service' &&
      github.ref_name == 'CI_dev'
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 15
    permissions: {contents: read, actions: read, pull-requests: write, issues: write, statuses: write, checks: write, pages: write, id-token: write}
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Restore durable monitor incidents
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {data} = await github.rest.actions.listArtifactsForRepo({...context.repo, name:'ci-v4-monitor-state', per_page:100});
            for (const artifact of data.artifacts) {
              if (artifact.expired || artifact.workflow_run?.head_branch !== 'CI_dev') continue;
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:artifact.workflow_run.id});
              if (run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/ci-gateway.yml' ||
                  (run.display_title !== 'CI v4 | service | receiver' &&
                   !run.display_title.startsWith('CI v4 | service | PR ')) ||
                  run.head_repository?.full_name !== context.payload.repository.full_name) continue;
              const response = await github.rest.actions.downloadArtifact({...context.repo, artifact_id:artifact.id, archive_format:'zip'});
              fs.writeFileSync('monitor-state.zip', Buffer.from(response.data));
              break;
            }
      - name: Prepare dashboard and monitor state
        run: |
          mkdir -p _site monitor-state
          cp -R dashboard/. _site/
          if [ -f monitor-state.zip ]; then unzip -o monitor-state.zip -d monitor-state; fi
      - name: Receive valid results and reconcile cancellations
        id: collect
        continue-on-error: true
        run: python3 scripts/ci/gateway_v4.py collect
      - name: Check worker health independently of the server
        id: monitor
        continue-on-error: true
        env:
          HEALTH_URL: ${{ vars.LOCAL_CI_HEALTH_URL }}
          EXPECTED_WORKER: ${{ vars.LOCAL_CI_WORKER_ID }}
          GITEE_HEALTH_TOKEN: ${{ secrets.GITEE_HEALTH_TOKEN }}
          LOCAL_CI_SMTP_HOST: ${{ secrets.LOCAL_CI_SMTP_HOST }}
          LOCAL_CI_SMTP_PORT: ${{ secrets.LOCAL_CI_SMTP_PORT }}
          LOCAL_CI_SMTP_USERNAME: ${{ secrets.LOCAL_CI_SMTP_USERNAME }}
          LOCAL_CI_SMTP_PASSWORD: ${{ secrets.LOCAL_CI_SMTP_PASSWORD }}
          LOCAL_CI_SMTP_FROM: ${{ secrets.LOCAL_CI_SMTP_FROM }}
          LOCAL_CI_SMTP_TO: ${{ secrets.LOCAL_CI_SMTP_TO }}
          LOCAL_CI_SMTP_STARTTLS: ${{ vars.LOCAL_CI_SMTP_STARTTLS || 'true' }}
        run: |
          test -n "$HEALTH_URL" && test -n "$EXPECTED_WORKER" || { echo '::error::Configure LOCAL_CI_HEALTH_URL and LOCAL_CI_WORKER_ID'; exit 2; }
          python3 scripts/local_ci/maintenance/watchdog.py \
          --url "$HEALTH_URL" --expected-worker "$EXPECTED_WORKER" \
          --state monitor-state/incidents.json --output _site/data/v4-incidents.json \
          --tasks-file monitor-tasks.json
      - name: Preserve incidents and undelivered notifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-v4-monitor-state
          path: monitor-state/
          retention-days: 30
      - uses: actions/configure-pages@v5
        if: ${{ steps.collect.outcome == 'success' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.collect.outcome == 'success' }}
        with: {path: _site}
      - name: Publish dashboard
        if: ${{ steps.collect.outcome == 'success' }}
        id: pages
        uses: actions/deploy-pages@v4
      - name: Surface monitor or receiver failures
        if: ${{ always() && (steps.monitor.outcome == 'failure' || steps.collect.outcome == 'failure' || steps.collect.outputs.receiver_errors != '0') }}
        run: exit 1

  validate-worker:
    if: >-
      github.repository == 'likehupochuan/triton-anchor' &&
      github.event_name == 'workflow_dispatch' && inputs.mode != 'request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the routed trusted worker revision
        env:
          WORKER_SHA: ${{ inputs.worker_revision_sha }}
        run: |
          test "$GITHUB_REF_NAME" = CI_dev
          test "$GITHUB_SHA" = "$WORKER_SHA"
