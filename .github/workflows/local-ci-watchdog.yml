name: Local CI independent watchdog

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      LOCAL_CI_HEARTBEAT_READ_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: local-ci-independent-watchdog
  cancel-in-progress: false

jobs:
  check-heartbeat:
    if: ${{ github.repository == 'anteloper-c/triton-anchor' && (github.event_name == 'workflow_dispatch' || vars.LOCAL_CI_WATCHDOG_ENABLED == 'true') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci_repo
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare explicitly configured watchdog
        env:
          WATCHDOG_URL: ${{ vars.LOCAL_CI_HEARTBEAT_URL }}
          WATCHDOG_WORKER: ${{ vars.LOCAL_CI_WORKER_ID }}
          WATCHDOG_MAX_AGE: ${{ vars.LOCAL_CI_HEARTBEAT_MAX_AGE_SECONDS || '1800' }}
          OPERATIONS_ISSUE: ${{ vars.LOCAL_CI_OPERATIONS_ISSUE_NUMBER }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ['WATCHDOG_URL', 'WATCHDOG_WORKER', 'OPERATIONS_ISSUE']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('请配置 LOCAL_CI_HEARTBEAT_URL、LOCAL_CI_WORKER_ID 和 LOCAL_CI_OPERATIONS_ISSUE_NUMBER；部署完成前保持 LOCAL_CI_WATCHDOG_ENABLED=false。')
          if not os.environ['OPERATIONS_ISSUE'].isdigit() or int(os.environ['OPERATIONS_ISSUE']) <= 0:
              raise SystemExit('LOCAL_CI_OPERATIONS_ISSUE_NUMBER 必须是本仓库已创建的运维 Issue 编号。')
          config = {
              'worker_id': os.environ['WATCHDOG_WORKER'],
              'state_dir': str(Path('.watchdog-state').resolve()),
              'heartbeat_url': os.environ['WATCHDOG_URL'],
              'max_age_seconds': int(os.environ['WATCHDOG_MAX_AGE']),
              'token_env': 'LOCAL_CI_HEARTBEAT_READ_TOKEN',
              'github': {'repository': 'anteloper-c/triton-anchor',
                         'issue_number': int(os.environ['OPERATIONS_ISSUE']),
                         'token_env': 'GITHUB_TOKEN'}
          }
          Path(os.environ['RUNNER_TEMP'], 'watchdog.json').write_text(json.dumps(config), encoding='utf-8')
          PY

      - name: Check independently published heartbeat and update operations Issue
        env:
          LOCAL_CI_HEARTBEAT_READ_TOKEN: ${{ secrets.LOCAL_CI_HEARTBEAT_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.local_ci.maintenance.watchdog --config "$RUNNER_TEMP/watchdog.json"

      - name: Upload watchdog result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ci-watchdog-result
          path: .watchdog-state/watchdog-latest.json
          if-no-files-found: ignore
          retention-days: 14
