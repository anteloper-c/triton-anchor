name: Public API Breaking Change Notification
run-name: ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: ["Public API Compatibility"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  notify:
    name: Notify change author
    if: ${{ github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download compatibility result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: public-api-compatibility
          path: api-result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update notification
        uses: actions/github-script@v7
        env:
          RESULT_PATH: api-result/api-compat-result.json
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- triton-anchor-api-breaking -->';
            const resultPath = process.env.RESULT_PATH;
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            if (!fs.existsSync(resultPath)) {
              core.notice('No API compatibility result artifact was available.');
              return;
            }

            const stat = fs.statSync(resultPath);
            if (stat.size > 1024 * 1024) {
              core.warning('Ignoring an unexpectedly large API result artifact.');
              return;
            }

            let result;
            try {
              result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            } catch (error) {
              core.warning(`Invalid API result JSON: ${error.message}`);
              return;
            }

            const validResult =
              result &&
              result.schema_version === 1 &&
              ['breaking', 'compatible'].includes(result.status) &&
              Array.isArray(result.changes) &&
              result.event_name === run.event &&
              typeof result.head_sha === 'string' &&
              /^[0-9a-f]{40}$/i.test(result.head_sha) &&
              result.head_sha === run.head_sha;

            if (!validResult) {
              core.info('The result is erroneous, stale, or malformed; no author notification is needed.');
              return;
            }

            const breakingChanges = result.changes.filter((change) =>
              change &&
              change.severity === 'breaking' &&
              typeof change.symbol === 'string' &&
              typeof change.message === 'string'
            );
            if (
              result.status === 'breaking' &&
              (!Number.isInteger(result.breaking_count) ||
                result.breaking_count <= 0 ||
                breakingChanges.length === 0)
            ) {
              core.warning('Breaking result did not contain a valid count and change list.');
              return;
            }

            function validLogin(value) {
              return typeof value === 'string' && /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(value)
                ? value
                : null;
            }

            function inlineCode(value) {
              return String(value).replace(/[`\r\n]/g, ' ').slice(0, 180);
            }

            function plainText(value) {
              return String(value)
                .replace(/[\r\n]+/g, ' ')
                .replace(/[<>`]/g, '')
                .slice(0, 300);
            }

            const shownChanges = breakingChanges.slice(0, 20);
            const details = shownChanges.map((change) =>
              `- \`${inlineCode(change.symbol)}\`: ${plainText(change.message)}`
            );
            if (breakingChanges.length > shownChanges.length) {
              details.push(`- ...and ${breakingChanges.length - shownChanges.length} more`);
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
            function bodyFor(login) {
              return [
                marker,
                `@${login} the public API compatibility check detected ${result.breaking_count} breaking change(s).`,
                '',
                ...details,
                '',
                `[View the compatibility report](${runUrl})`,
                '',
                'This comment is updated automatically when the check runs again.'
              ].join('\n');
            }

            function resolvedBody() {
              return [
                marker,
                'Resolved: the latest public API compatibility result is compatible.',
                '',
                `[View the compatibility report](${runUrl})`,
                '',
                'This comment is updated automatically when the check runs again.'
              ].join('\n');
            }

            if (run.event === 'pull_request') {
              const prNumber = Number(result.pr_number || run.pull_requests?.[0]?.number);
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.warning('No valid pull request number was found in the result.');
                return;
              }

              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pull.head.sha !== result.head_sha) {
                core.notice('The pull request has advanced since this result; skipping a stale notification.');
                return;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100
              });
              const existing = comments.find((comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );
              if (result.status === 'compatible') {
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                    body: resolvedBody()
                  });
                }
                return;
              }

              const login = validLogin(pull.user?.login) || validLogin(run.actor?.login);
              if (!login) {
                core.warning('Could not determine a safe GitHub login to mention.');
                return;
              }
              const body = bodyFor(login);
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
              return;
            }

            const comments = await github.paginate('GET /repos/{owner}/{repo}/commits/{commit_sha}/comments', {
              owner,
              repo,
              commit_sha: result.head_sha,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (result.status === 'compatible') {
              if (existing) {
                await github.request('PATCH /repos/{owner}/{repo}/comments/{comment_id}', {
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: resolvedBody()
                });
              }
              return;
            }

            const login = validLogin(run.actor?.login) || validLogin(result.actor);
            if (!login) {
              core.warning('Could not determine a safe GitHub login to mention.');
              return;
            }
            const body = bodyFor(login);
            if (existing) {
              await github.request('PATCH /repos/{owner}/{repo}/comments/{comment_id}', {
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.request('POST /repos/{owner}/{repo}/commits/{commit_sha}/comments', {
                owner,
                repo,
                commit_sha: result.head_sha,
                body
              });
            }
