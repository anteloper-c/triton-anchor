name: Public API Compatibility

on:
  pull_request:
  push:
    branches: [main, develop, jiwang-delivery-ci, ai-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-compatibility:
    name: Check stable Python API
    runs-on: ubuntu-latest
    steps:
      - name: Resolve comparison revisions
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            head_repository="$PR_HEAD_REPOSITORY"
            pr_number="$PR_NUMBER"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$CURRENT_SHA"
            head_repository="$CURRENT_REPOSITORY"
            pr_number=0
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$head_sha"
          fi

          {
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "head_repository=$head_repository"
            echo "pr_number=$pr_number"
            echo "actor=$ACTOR"
          } >> "$GITHUB_OUTPUT"

      - name: Check out base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.base_sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Check out candidate revision
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.refs.outputs.head_repository }}
          ref: ${{ steps.refs.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compare public API
        id: contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ steps.refs.outputs.actor }}
          PR_NUMBER: ${{ steps.refs.outputs.pr_number }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          if [[ -f base/scripts/api_contract/check_public_api.py && -f base/api_contract/public_api.json ]]; then
            checker=base/scripts/api_contract/check_public_api.py
            scope=base/api_contract/public_api.json
          else
            # Bootstrap path for the first merge that introduces this check.
            checker=candidate/scripts/api_contract/check_public_api.py
            scope=candidate/api_contract/public_api.json
          fi

          set +e
          python "$checker" \
            --base-root base \
            --candidate-root candidate \
            --scope "$scope" \
            --candidate-scope candidate/api_contract/public_api.json \
            --json-output api-compat-result.json \
            --markdown-output api-compat-report.md \
            --event-name "$EVENT_NAME" \
            --actor "$ACTOR" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f api-compat-report.md ]]; then
            cat api-compat-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Public API checker did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compatibility result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-compatibility
          path: |
            api-compat-result.json
            api-compat-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Apply compatibility result
        if: always()
        shell: bash
        env:
          CHECK_EXIT_CODE: ${{ steps.contract.outputs.exit_code }}
        run: exit "${CHECK_EXIT_CODE:-1}"
