name: Receive Local CI Result
run-name: "${{ inputs.run_title || (inputs.pr_number != '' && format('PR {0} | h:{1} m:{2} | receive {3}', inputs.pr_number, inputs.expected_head_sha, inputs.tested_sha, inputs.attempt)) || format('Push {0} | {1} | receive {2}', inputs.source_branch, inputs.tested_sha, inputs.attempt) }}"

on:
  workflow_call:
    inputs:
      pr_number:
        required: false
        default: ""
        type: string
      expected_head_sha:
        required: false
        default: ""
        type: string
      comparison_base_sha:
        required: false
        default: ""
        type: string
      tested_sha:
        required: true
        type: string
      worker_revision_sha:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      task_ref:
        required: true
        type: string
      task_id:
        required: true
        type: string
      context:
        required: false
        default: ""
        type: string
      attempt:
        required: true
        type: string
      started_at:
        required: true
        type: string
      wait_seconds:
        required: true
        type: string
      run_title:
        required: false
        default: ""
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  actions: write
  contents: read
  statuses: write
  issues: write
  pull-requests: write

concurrency:
  group: receive-local-ci-${{ inputs.task_ref }}
  cancel-in-progress: ${{ inputs.attempt == '1' }}

jobs:
  receive:
    name: Wait for local CI result
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      result_ready: ${{ steps.bridge.outputs.result_ready }}
      overall_status: ${{ steps.bridge.outputs.overall_status }}
      target_url: ${{ steps.bridge.outputs.target_url }}
      stage_results: ${{ steps.bridge.outputs.stage_results }}
    env:
      CONTEXT: ${{ startsWith(inputs.task_ref, 'ci/pr-') && 'local-ci/summary' || (startsWith(inputs.task_ref, 'ci/full/') && 'local-ci/summary/full' || 'local-ci/summary/push') }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
      TESTED_SHA: ${{ inputs.tested_sha }}
      WORKER_REVISION_SHA: ${{ inputs.worker_revision_sha }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      TASK_REF: ${{ inputs.task_ref }}
      TASK_ID: ${{ inputs.task_id }}
      ATTEMPT: ${{ inputs.attempt }}
      STARTED_AT: ${{ inputs.started_at }}
      WAIT_SECONDS: ${{ inputs.wait_seconds }}
      MAX_ATTEMPTS: ${{ vars.LOCAL_CI_RECEIVER_MAX_ATTEMPTS || '6' }}
      POLL_INTERVAL_SECONDS: ${{ vars.LOCAL_CI_BRIDGE_POLL_INTERVAL_SECONDS || '60' }}
      GITEE_RESULTS_OWNER: ${{ vars.GITEE_RESULTS_OWNER || 'heron-mc' }}
      GITEE_RESULTS_REPO: ${{ vars.GITEE_RESULTS_REPO }}
      GITEE_RESULTS_BRANCH: ${{ vars.GITEE_RESULTS_BRANCH || 'local-ci-results' }}
      GITEE_RESULTS_WEB_URL: ${{ vars.GITEE_RESULTS_WEB_URL }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.worker_revision_sha }}
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Wait for Gitee Local CI result
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "result_ready=false" >> "${GITHUB_OUTPUT}"
          set +e
          python scripts/local_ci/runtime/receive_result.py \
            --repository "${REPO}" \
            --gitee-owner "${GITEE_RESULTS_OWNER}" --gitee-repo "${GITEE_RESULTS_REPO}" \
            --gitee-results-branch "${GITEE_RESULTS_BRANCH}" --gitee-web-url "${GITEE_RESULTS_WEB_URL}" \
            --task-ref "${TASK_REF}" --task-id "${TASK_ID}" \
            --sha "${TESTED_SHA}" --worker-revision-sha "${WORKER_REVISION_SHA}" \
            --pr-number "${PR_NUMBER}" --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --comparison-base-sha "${COMPARISON_BASE_SHA}" --target-branch "${TARGET_BRANCH}" \
            --context "${CONTEXT}" --timeout-seconds "${WAIT_SECONDS}" \
            --poll-interval-seconds "${POLL_INTERVAL_SECONDS}"
          bridge_status=$?
          set -e

          case "${bridge_status}" in
            0|10)
              echo "result_ready=true" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
            11)
              echo "Stale PR result was ignored."
              exit 0
              ;;
            3)
              if [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; then
                next_attempt=$((ATTEMPT + 1))
                if [ -n "${PR_NUMBER}" ]; then
                  receiver_title="PR ${PR_NUMBER} | h:${EXPECTED_HEAD_SHA:0:7} m:${TESTED_SHA:0:7} | receive ${next_attempt}/${MAX_ATTEMPTS}"
                else
                  receiver_title="Push ${SOURCE_BRANCH} | ${TESTED_SHA:0:7} | receive ${next_attempt}/${MAX_ATTEMPTS}"
                fi
                gh workflow run ci-gateway.yml --repo "${REPO}" --ref "${GITHUB_REF_NAME}" \
                  -f gateway_kind=triton-anchor-ci-gateway -f mode=receive \
                  -f pr_number="${PR_NUMBER}" -f expected_head_sha="${EXPECTED_HEAD_SHA}" \
                  -f comparison_base_sha="${COMPARISON_BASE_SHA}" -f tested_sha="${TESTED_SHA}" \
                  -f worker_revision_sha="${WORKER_REVISION_SHA}" \
                  -f source_branch="${SOURCE_BRANCH}" -f target_branch="${TARGET_BRANCH}" \
                  -f task_ref="${TASK_REF}" -f task_id="${TASK_ID}" -f context="${CONTEXT}" \
                  -f attempt="${next_attempt}" -f started_at="${STARTED_AT}" \
                  -f wait_seconds="${WAIT_SECONDS}" \
                  -f run_title="${receiver_title}"
                gh api --method POST "repos/${REPO}/statuses/${TESTED_SHA}" \
                  -f state=pending -f context="${CONTEXT}" \
                  -f description="local CI still running; receiver ${next_attempt}/${MAX_ATTEMPTS}"
                exit 0
              fi
              description="local CI result not received after ${MAX_ATTEMPTS} receiver attempts"
              ;;
            *) description="local CI result receiver failed" ;;
          esac
          gh api --method POST "repos/${REPO}/statuses/${TESTED_SHA}" \
            -f state=error -f context="${CONTEXT}" -f description="${description}"
          if [[ "${TASK_REF}" == "ci/pr-${PR_NUMBER}/"* ]] && [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] && [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            gh api --method POST "repos/${REPO}/statuses/${EXPECTED_HEAD_SHA}" \
              -f state=error -f context=local-ci/summary -f description="${description}"
          fi
          exit 1

      - name: Request Dashboard refresh through Gateway
        if: ${{ always() && steps.bridge.outputs.result_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAGES_BRANCH: ${{ vars.LOCAL_CI_PAGES_BRANCH || 'ci_repo' }}
        run: |
          pages_sha=$(gh api "repos/${REPO}/commits/${PAGES_BRANCH}" --jq .sha)
          gh workflow run ci-gateway.yml --repo "${REPO}" --ref "${PAGES_BRANCH}" \
            -f gateway_kind=triton-anchor-ci-gateway -f mode=pages \
            -f tested_sha="${pages_sha}" -f worker_revision_sha="${pages_sha}" \
            -f source_branch="${PAGES_BRANCH}" -f target_branch="${PAGES_BRANCH}" \
            -f task_ref="ci/push/${PAGES_BRANCH}" \
            -f run_title="Dashboard | CI result refresh"

  result-summary:
    name: Local CI result
    needs: receive
    if: ${{ always() && needs.receive.outputs.result_ready == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Show verified Local CI conclusion
        env:
          OVERALL_STATUS: ${{ needs.receive.outputs.overall_status }}
          TARGET_URL: ${{ needs.receive.outputs.target_url }}
          STAGE_RESULTS: ${{ needs.receive.outputs.stage_results }}
        run: |
          python3 - <<'PY'
          import json
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('## Codex Local CI\n\n')
              stream.write('| Check | Status |\n| --- | --- |\n')
              for name, status in json.loads(os.environ['STAGE_RESULTS']).items():
                  stream.write(f'| {name} | {status} |\n')
              stream.write('\n[完整结果与证据](' + os.environ['TARGET_URL'] + ')\n')
          PY
          [ "${OVERALL_STATUS}" = success ]
